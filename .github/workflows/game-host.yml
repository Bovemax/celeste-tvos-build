name: FNA game host
on:
  workflow_dispatch:
  push:
    paths:
      - 'game-host/**'
      - 'probe-payload/**'
      - 'desktop-check/**'
      - '.github/workflows/game-host.yml'
permissions:
  contents: read
concurrency:
  group: fna-game-host
  cancel-in-progress: true
jobs:
  host:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build pinned public managed FNA
        run: |
          set -euo pipefail
          git config --global url.https://github.com/.insteadOf git://github.com/
          git clone https://github.com/FNA-XNA/FNA.git upstream-fna
          git -C upstream-fna checkout d52b4ce61e4086b785c51a96d331dbf106975a58
          git -C upstream-fna submodule update --init --recursive
          dotnet build upstream-fna/FNA.Core.csproj -c Release -f netstandard2.0
          mkdir -p deps
          dll=$(find upstream-fna/bin -name FNA.dll -type f -print -quit)
          test -n "$dll"
          cp "$dll" deps/FNA.dll
      - name: Compile independent managed diagnostic payload
        run: dotnet build probe-payload/ExternalProbe.csproj -c Release
      - name: Build portable desktop managed preflight
        run: |
          dotnet publish desktop-check/DesktopCheck.csproj -c Release -o desktop-check-out -p:UseAppHost=false
          cp deps/FNA.dll desktop-check-out/FNA.dll
          cp upstream-fna/licenses/LICENSE desktop-check-out/FNA-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-managed-check
          path: desktop-check-out/
          if-no-files-found: error
          retention-days: 30
      - name: Install tvOS workload
        run: dotnet workload install tvos
      - name: Publish unsigned interpreter host
        run: |
          set -euo pipefail
          dotnet publish game-host/GameHost.csproj -c Release -r tvos-arm64 -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false -p:BuildIpa=false
          APP=$(find game-host/bin -name '*.app' -type d -print -quit)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CelesteLocalPayloadVersion' "$APP/Info.plist" | grep -x 2
          mkdir -p out/Payload
          cp probe-payload/bin/Release/net10.0/ExternalProbe.dll out/ExternalProbe.dll
          ditto "$APP" out/Payload/GameHost.app
          mkdir -p out/Payload/GameHost.app/GameAssemblies/Content
          # No game files, FMOD, or native dependency binaries are supplied here.
          ditto -c -k --keepParent out/Payload out/GameHost-base.ipa
          unzip -t out/GameHost-base.ipa | tail -1
          xcrun vtool -show-build out/Payload/GameHost.app/GameHost
          for notice in upstream-fna/licenses/LICENSE upstream-fna/licenses/lzxdecoder.LICENSE upstream-fna/licenses/monoxna.LICENSE; do
            test -s "$notice"
            printf '\n--- %s ---\n' "$(basename "$notice")" >> out/FNA-LICENSE.txt
            cat "$notice" >> out/FNA-LICENSE.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fna-game-host-base-unsigned
          path: |
            out/GameHost-base.ipa
            out/FNA-LICENSE.txt
            out/ExternalProbe.dll
          if-no-files-found: error
          retention-days: 30
