name: Windows local Celeste toolkit
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["FNA game host"]
    types: [completed]
  push:
    paths:
      - 'tools/*.py'
      - 'tools/*.ps1'
      - '.github/workflows/windows-local-toolkit.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-local-toolkit
  cancel-in-progress: true
jobs:
  toolkit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -v
      - name: Validate portable setup script syntax
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/Setup-Toolchain.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - run: python -m pip install pyinstaller==6.11.1
      - name: Freeze local tools into Windows executables
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory _runtime-CelesteLocalBuild --name CelesteLocalBuild --distpath frozen tools/build_local.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory _runtime-CelestePackage --name CelestePackage --distpath frozen tools/package_game.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory _runtime-CelestePrepareInputs --name CelestePrepareInputs --distpath frozen tools/create_input_pack.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory _runtime-CelesteExtractLLVM --name CelesteExtractLLVM --distpath frozen tools/extract_llvm.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm --onedir --contents-directory _runtime-CelesteLinkFMOD --name CelesteLinkFMOD --distpath frozen tools/link_fmod_local.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force toolkit | Out-Null
          foreach ($name in @("CelesteLocalBuild", "CelestePackage", "CelestePrepareInputs", "CelesteExtractLLVM", "CelesteLinkFMOD")) {
            Move-Item "frozen/$name/$name.exe" toolkit
            Move-Item "frozen/$name/_runtime-$name" toolkit
          }
          # Exercise the executables from a relocated path containing spaces,
          # with a different working directory, before distributing them.
          $relocated = Join-Path $PWD "Portable toolkit with spaces"
          Move-Item toolkit $relocated
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($name in @("CelesteLocalBuild", "CelestePackage", "CelestePrepareInputs", "CelesteExtractLLVM", "CelesteLinkFMOD")) {
              & (Join-Path $relocated "$name.exe") --help
              if ($LASTEXITCODE -ne 0) { throw "$name failed from relocated directory" }
            }
          } finally { Pop-Location }
          Move-Item $relocated toolkit
          # Run the frozen extractor against a real xz-compressed fixture.
          python -c "import sys; sys.path.insert(0, 'tools'); from test_extract_llvm import fixture; fixture('llvm fixture.tar.xz')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & toolkit/CelesteExtractLLVM.exe "llvm fixture.tar.xz" "extracted LLVM fixture"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "extracted LLVM fixture/bin/lld.exe")) { throw "Frozen xz extraction failed" }
          Copy-Item tools/Setup-Toolchain.ps1 toolkit/Setup-Toolchain.ps1
          New-Item -ItemType Directory -Force repair | Out-Null
          Copy-Item toolkit/Setup-Toolchain.ps1, toolkit/CelesteExtractLLVM.exe -Destination repair
          Copy-Item toolkit/_runtime-CelesteExtractLLVM -Destination repair -Recurse
          & toolkit/CelestePrepareInputs.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & toolkit/CelesteLocalBuild.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & toolkit/CelestePackage.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: portable-toolchain-repair
          path: repair/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-fmod-local-linker
          path: |
            toolkit/CelesteLinkFMOD.exe
            toolkit/_runtime-CelesteLinkFMOD/
          if-no-files-found: error
          retention-days: 30
      - name: Find latest successful host
        id: host
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --repo "$env:GITHUB_REPOSITORY" --workflow game-host.yml --branch main --status success --limit 1 --json databaseId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $runs) { throw "No successful host run" }
          "run=$($runs[0].databaseId)" >> $env:GITHUB_OUTPUT
      - name: Reuse validated public interpreter host
        uses: actions/download-artifact@v4
        with:
          name: fna-game-host-base-unsigned
          run-id: ${{ steps.host.outputs.run }}
          github-token: ${{ github.token }}
          path: toolkit/host
      - name: Reuse validated public native framework
        uses: actions/download-artifact@v4
        with:
          name: public-fna-native-arm64
          run-id: 45489402010
          github-token: ${{ github.token }}
          path: toolkit/native
      - name: Exercise packaged executable against real host and native framework
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path toolkit/host/ExternalProbe.dll) { $extra = @("--probe-assembly", "toolkit/host/ExternalProbe.dll") }
          & toolkit/CelestePackage.exe toolkit/host/GameHost-base.ipa Windows-toolkit-probe.ipa --native toolkit/native/CelesteNative.dylib --probe @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m zipfile -t Windows-toolkit-probe.ipa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item Windows-toolkit-probe.ipa toolkit/FNA-probe.ipa
          Copy-Item README.md toolkit/README.md
          Copy-Item tools/Setup-Toolchain.ps1 toolkit/Setup-Toolchain.ps1
          "Host run: ${{ steps.host.outputs.run }}" | Set-Content toolkit/build-inputs.txt
          "Native run: 45489402010" | Add-Content toolkit/build-inputs.txt
          Get-ChildItem toolkit -Filter *.exe | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 240 | Set-Content toolkit/executable-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: celeste-windows-local-toolkit
          path: toolkit/
          if-no-files-found: error
          retention-days: 30
