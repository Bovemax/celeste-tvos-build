name: Everest portable preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'everest-preflight/**'
      - '.github/workflows/everest-preflight.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify synthetic Everest fixtures
        run: bash everest-preflight/build-fixtures.sh
