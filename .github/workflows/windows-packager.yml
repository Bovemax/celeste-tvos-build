name: Windows IPA packager tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/*.py'
      - '.github/workflows/windows-packager.yml'
permissions:
  contents: read
jobs:
  packaging:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -v
